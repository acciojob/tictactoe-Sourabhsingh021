<!DOCTYPE html>

<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 60%;
            height: 60%;
            text-align: center;
        }

        h1 {
            font-family: 'Permanent Marker', cursive;
            color: black;
            letter-spacing: 2px;
        }

        input {
            border: 2px solid black;
        }

        #submit {
            padding: 8px 25px;
            border: 2px solid;
            border-radius: 6px;
            background-color: #FFFFFF;
        }

        .board {
            width: 250px;
            height: 250px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            margin: auto;
        }

        .box {
            border: 1px solid black;
            background-color: #FFC0CB;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-family: 'Permanent Marker', cursive;
        }
    </style>
</head>

<body>
    <!-- the entire body must be written by student -->
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <label for="player-1">Player 1</label>
        <input type="text" id="player1" placeholder="enter name">
        <br><br>
        <label for="player-2">player 2</label>
        <input type="text" id="player2" placeholder="enter name">
        <br><br>
        <button id="submit">Start Game</button>
    </div>

    <script>
        let container = document.querySelector(".container");
        let submit = document.getElementById("submit");

        player1= document.getElementById("player1");
        player2 = document.getElementById("player2");

        submit.addEventListener("click", () => {
            container.innerHTML = ""
            let heading = document.createElement("h1");
            heading.textContent = "Tic Tac Toe"

            let player1Name = player1.value;
            let player2Name = player2.value;

            let player = player1Name;
            let message = document.createElement("div");
            message.textContent = `${player}, you're up`


            let board = document.createElement("div");
            board.classList.add("board");

            const result = Array(3).fill().map(() => Array(3).fill(""));

            for (let i = 0; i < 9; i++) {
                let box = document.createElement("div");
                box.classList.add("box");
				box.id = i;
                board.appendChild(box);

                box.addEventListener("click", (e, index) => {
                    if (player === player1Name) {
                        box.textContent = "X"

                        if (i === 0) result[0][0] = "X";
                        else if (i === 1) result[0][1] = "X";
                        else if (i === 2) result[0][2] = "X";
                        else if (i === 3) result[1][0] = "X";
                        else if (i === 4) result[1][1] = "X";
                        else if (i === 5) result[1][2] = "X";
                        else if (i === 6) result[2][0] = "X";
                        else if (i === 7) result[2][1] = "X";
                        else result[2][2] = "X";

                        player = player2Name;
                        message.textContent = `${player}, you're up`;

                    } else {
                        box.textContent = "O"

                        if (i === 0) result[0][0] = "O";
                        else if (i === 1) result[0][1] = "O";
                        else if (i === 2) result[0][2] = "O";
                        else if (i === 3) result[1][0] = "O";
                        else if (i === 4) result[1][1] = "O";
                        else if (i === 5) result[1][2] = "O";
                        else if (i === 6) result[2][0] = "O";
                        else if (i === 7) result[2][1] = "O";
                        else result[2][2] = "O";
                        console.log(result)

                        player = player1Name;
                        message.textContent = `${player}, you're up`;
                    }

                    let boxes = document.querySelectorAll(".box")
                    console.log(boxes);

                    let winner = false;

                    if (result[0][0] === result[0][1] && result[0][1] === result[0][2] && result[0][0] !== "") {
                        boxes[0].style.backgroundColor = "#800080";
                        boxes[1].style.backgroundColor = "#800080";
                        boxes[2].style.backgroundColor = "#800080";

                        if (result[0][0] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }
                        return;
                    }
                    else if (result[1][0] === result[1][1] && result[1][1] === result[1][2] && result[1][0] !== "") {
                        boxes[3].style.backgroundColor = "#800080";
                        boxes[4].style.backgroundColor = "#800080";
                        boxes[5].style.backgroundColor = "#800080";

                        if (result[1][0] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }

                    }
                    else if (result[2][0] === result[2][1] && result[2][1] === result[2][2] && result[2][0] !== "") {
                        boxes[6].style.backgroundColor = "#800080";
                        boxes[7].style.backgroundColor = "#800080";
                        boxes[8].style.backgroundColor = "#800080";

                        if (result[2][0] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }

                    }
                    else if (result[0][0] === result[1][0] && result[1][0] === result[2][0] && result[0][0] !== "") {
                        boxes[0].style.backgroundColor = "#800080";
                        boxes[3].style.backgroundColor = "#800080";
                        boxes[6].style.backgroundColor = "#800080";

                        if (result[0][0] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }

                    }
                    else if (result[0][1] === result[1][1] && result[1][1] === result[2][1] && result[0][1] !== "") {
                        boxes[1].style.backgroundColor = "#800080";
                        boxes[4].style.backgroundColor = "#800080";
                        boxes[7].style.backgroundColor = "#800080";

                        if (result[0][1] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }

                    }
                    else if (result[0][2] === result[1][2] && result[1][2] === result[2][2] && result[0][2] !== "") {
                        boxes[2].style.backgroundColor = "#800080";
                        boxes[5].style.backgroundColor = "#800080";
                        boxes[8].style.backgroundColor = "#800080";

                        if (result[0][2] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }

                    }
                    else if (result[0][0] === result[1][1] && result[1][1] === result[2][2] && result[0][0] !== "") {
                        boxes[0].style.backgroundColor = "#800080";
                        boxes[4].style.backgroundColor = "#800080";
                        boxes[8].style.backgroundColor = "#800080";

                        if (result[0][0] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }

                    } else if (result[0][2] === result[1][1] && result[1][1] === result[2][0] && result[0][2] !== "") {
                        boxes[2].style.backgroundColor = "#800080";
                        boxes[4].style.backgroundColor = "#800080";
                        boxes[6].style.backgroundColor = "#800080";

                        if (result[0][2] === "X") {
                            message.textContent = `${player1Name}, congratulations you won!`;
                        } else {
                            message.textContent = `${player2Name}, congratulations you won!`;
                        }
                    }
                })
            }

            container.appendChild(heading);
            container.appendChild(message)
            container.appendChild(board);
        });



    </script>

</body>

</html>
