<!DOCTYPE html>

<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
			overflow-x: hidden;
        }

        .container {
            width: 60%;
            height: 60%;
			margin: auto;
			text-align:center;
        }

        h1 {
            font-family: 'Permanent Marker', cursive;
            color: black;
            letter-spacing: 2px;
        }

        input {
            border: 2px solid black;
        }

        #submit {
            padding: 8px 25px;
            border: 2px solid;
            border-radius: 6px;
            background-color: #FFFFFF;
        }

        .board {
            width: 250px;
            height: 250px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            margin: auto;
        }

        .box {
            border: 1px solid black;
            background-color: #FFC0CB;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-family: 'Permanent Marker', cursive;
        }
    </style>
</head>

<body>
    <!-- the entire body must be written by student -->
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <label for="player-1">Player 1</label>
        <input type="text" id="player-1" placeholder="enter name">
        <br><br>
        <label for="player-2">player 2</label>
        <input type="text" id="player-2" placeholder="enter name">
        <br><br>
        <button id="submit">Start Game</button>

        <p id="msg"></p>
        <div class="board"></div>
    </div>
    <script>


        // logic starts here
        const submitBtn = document.getElementById("submit");
        const player1 = document.getElementById("player-1")
        const player2 = document.getElementById("player-2")

        let currentPlayer = "X";
        let gameOver = false;
        let gameStarted = false;

        submitBtn.addEventListener("click", () => {
            if (!player1.value || !player2.value) {
                console.log("input not filled")
                return;
            }

            gameStarted = true;
            submitBtn.disabled = true;

            const board = document.querySelector(".board");
            const msg = document.getElementById("msg");
            msg.textContent = `${player1.value}, you're up`;

            //creating board
            for (let i = 0; i < 9; i++) {
                let box = document.createElement("div");
                box.classList.add("box");
                box.dataset.index = i;
                board.appendChild(box);
            }

            board.addEventListener("click", (e) => {
                if (gameOver) return;
                if (!e.target.classList.contains("box")) return;
                if (e.target.textContent !== "") return;

                e.target.textContent = currentPlayer;

                let win = isWinner(currentPlayer, Number(e.target.dataset.index));
                console.log(win)

                if (win) {
                    msg.textContent = `${currentPlayer === "X" ? player1.value : player2.value}, congratulations you won`;

                    gameOver = true;
                } else {
                    msg.textContent = `${currentPlayer === "X" ? player2.value : player1.value}, you're up`;
                    currentPlayer = currentPlayer === "X" ? "O" : "X";
                }
            })
        })



        // winning logic
        const boardData = new Array(9);
        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [2, 4, 6],
            [0, 4, 8]
        ]

        function isWinner(currentPlayer, index) {
            if (boardData[index]) return;
            boardData[index] = currentPlayer;

            let boxes = document.querySelectorAll(".box");

            for (const [a, b, c] of winningConditions) {

                if (boardData[a] &&
                    boardData[a] === boardData[b] &&
                    boardData[a] === boardData[c]
                ) {
                    console.log(a, b, c)
                    console.log(boxes)
                    boxes[a].style.backgroundColor = "#800080"
                    boxes[b].style.backgroundColor = "#800080"
                    boxes[c].style.backgroundColor = "#800080"
                    return true;
                }
            }
            return false;
        }

    </script>

</body>

</html>
