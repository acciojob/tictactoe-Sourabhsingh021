<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <title>Tic Tac Toe</title>
    <style>
        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            width: 60%;
            text-align: center;
        }

        h1 {
            font-family: 'Permanent Marker', cursive;
            color: black;
            letter-spacing: 2px;
        }

        input {
            border: 2px solid black;
            padding: 6px;
        }

        #submit {
            padding: 8px 25px;
            border: 2px solid;
            border-radius: 6px;
            background-color: #FFFFFF;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .board {
            width: 250px;
            height: 250px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            margin: 20px auto 0;
        }

        .box {
            border: 1px solid black;
            background-color: #FFC0CB;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-family: 'Permanent Marker', cursive;
            cursor: pointer;
            user-select: none;
        }

        .message {
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
		<h1>Tic Tac Toe</h1>
        <div id="setup">
			
            <label for="player1">Player 1</label>
            <input type="text" id="player1" placeholder="enter name">

            <br><br>

            <label for="player2">Player 2</label>
            <input type="text" id="player2" placeholder="enter name">

            <br><br>

            <button id="submit">Start Game</button>
        </div>

        <div id="gameArea" class="hidden">
            
            <div class="message"></div>
            <div class="board"></div>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById("submit");
        const player1 = document.getElementById("player1");
        const player2 = document.getElementById("player2");

        const setup = document.getElementById("setup");
        const gameArea = document.getElementById("gameArea");
        const board = document.querySelector(".board");
        const msg = document.querySelector(".message");

        let currentPlayer = "x";
        let gameOver = false;
        let gameStarted = false;

        const boardData = new Array(9).fill(undefined);
        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [2, 4, 6],
            [0, 4, 8]
        ];

        function createBoard() {
            board.innerHTML = "";

            for (let i = 0; i < 9; i++) {
                const box = document.createElement("div");
                box.classList.add("box");
                box.id = i + 1;
                board.appendChild(box);
            }
        }

        function isWinner(currentPlayer, index) {
            boardData[index] = currentPlayer;

            const boxes = document.querySelectorAll(".box");

            for (const [a, b, c] of winningConditions) {
                if (
                    boardData[a] &&
                    boardData[a] === boardData[b] &&
                    boardData[a] === boardData[c]
                ) {
                    boxes[a].style.backgroundColor = "#800080";
                    boxes[b].style.backgroundColor = "#800080";
                    boxes[c].style.backgroundColor = "#800080";
                    return true;
                }
            }

            return false;
        }

        submitBtn.addEventListener("click", () => {
            if (gameStarted) return;

            if (!player1.value.trim() || !player2.value.trim()) {
                msg.textContent = "Please enter both player names.";
                return;
            }

            gameStarted = true;
            submitBtn.disabled = true;

            setup.classList.add("hidden");
            gameArea.classList.remove("hidden");

            currentPlayer = "x";
            gameOver = false;
            boardData.fill(undefined);

            createBoard();
            msg.textContent = `${player1.value}, you're up`;
        });

        board.addEventListener("click", (e) => {
            if (gameOver) return;
            if (!e.target.classList.contains("box")) return;
            if (e.target.textContent !== "") return;

            const index = Number(e.target.id) - 1;
            e.target.textContent = currentPlayer;

            const win = isWinner(currentPlayer, index);

            if (win) {
                const winnerName = currentPlayer === "x" ? player1.value : player2.value;
                msg.textContent = `${winnerName} congratulations you won!`;
                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "x" ? "o" : "x";
            msg.textContent = `${currentPlayer === "x" ? player1.value : player2.value}, you're up`;
        });
    </script>
</body>
</html>
